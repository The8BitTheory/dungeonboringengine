# Testbuild der Lib (-DDBE_TEST, VICE-Rauchtest): wie lib.cfg, aber Datei bis $DBFF aufgefüllt ($EA) und
# Testfunktion 252 bei $DBC0 (RAM unter I/O, prüft BLOAD über $D000 und $FF00 = $7F).
MEMORY {
    HDR:    start = $AFFE, size = 2,     file = %O;
    CODE:   start = $B000, size = $2C00, file = %O, fill = yes, fillval = $EA;
    LIBTAB: start = $DC00, size = $0400, file = "";
    LIBBSS: start = $E000, size = $0800, file = "";
}
SEGMENTS {
    LOADADDR: load = HDR,    type = ro;
    CODE:     load = CODE,   type = rw;
    TESTHI:   load = CODE,   type = rw, start = $DBC0;
    LIBTAB:   load = LIBTAB, type = bss, define = yes;
    LIBBSS:   load = LIBBSS, type = bss, define = yes;
}
