# Test build of the lib (-DDBE_TEST, VICE smoke test): like lib.cfg, but the file starts at $AF00 (test functions 250-253 in
# TESTLO before the lib) and is padded ($EA) up to $DBFF, with test function 252 at $DBF8 (RAM under I/O, checks BLOAD across
# $D000 and $FF00 = $7F).
MEMORY {
    HDR:    start = $AEFE, size = 2,     file = %O;
    TLO:    start = $AF00, size = $0100, file = %O, fill = yes, fillval = $EA;
    CODE:   start = $B000, size = $2C00, file = %O, fill = yes, fillval = $EA;
    LIBTAB: start = $DC00, size = $0400, file = "";
    LIBBSS: start = $E000, size = $0800, file = "";
}
SEGMENTS {
    LOADADDR: load = HDR,    type = ro;
    CODE:     load = CODE,   type = rw;
    TESTLO:   load = TLO,    type = rw;
    TESTHI:   load = CODE,   type = rw, start = $DBF8;
    LIBTAB:   load = LIBTAB, type = bss, define = yes;
    LIBBSS:   load = LIBBSS, type = bss, define = yes;
}
