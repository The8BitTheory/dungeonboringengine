# Lib in bank 1 (docs/specs/P6-engine.md 2.4/2.6; the stub sets $FF00 = $7F, RAM under I/O):
# code $B000-$DBFF (11 KB), tables $DC00-$DFFF (LIBTAB: cell table of GEOMSET, work tables of VIEW; not in
# the file, INIT does not clear them), variables $E000-$E7FF (LIBBSS, not in the file, INIT clears them).
# If the code exceeds 11 KB, ld65 aborts.
MEMORY {
    HDR:    start = $AFFE, size = 2,     file = %O;
    CODE:   start = $B000, size = $2C00, file = %O;
    LIBTAB: start = $DC00, size = $0400, file = "";
    LIBBSS: start = $E000, size = $0800, file = "";
}
SEGMENTS {
    LOADADDR: load = HDR,    type = ro;
    CODE:     load = CODE,   type = rw;
    LIBTAB:   load = LIBTAB, type = bss, define = yes;
    LIBBSS:   load = LIBBSS, type = bss, define = yes;
}
