# Lib in Bank 1 (docs/specs/P6-engine.md 2.4/2.6): Code $B000-$CFFF (8 KB; darüber I/O bei $FF00 = $7E),
# Variablen $E000-$E7FF (nicht in der Datei, INIT löscht sie). Überschreitet der Code 8 KB, bricht ld65 ab.
MEMORY {
    HDR:    start = $AFFE, size = 2,     file = %O;
    CODE:   start = $B000, size = $2000, file = %O;
    LIBBSS: start = $E000, size = $0800, file = "";
}
SEGMENTS {
    LOADADDR: load = HDR,    type = ro;
    CODE:     load = CODE,   type = rw;
    LIBBSS:   load = LIBBSS, type = bss, define = yes;
}
