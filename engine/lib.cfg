# Lib in Bank 1. Obergrenze vorläufig $CFFF (darüber I/O bei $FF00 = $7E);
# die endgültige Größe wird nach der Messung festgelegt.
MEMORY {
    HDR: start = $BFFE, size = 2,     file = %O;
    RAM: start = $C000, size = $1000, file = %O;
}
SEGMENTS {
    LOADADDR: load = HDR, type = ro;
    CODE:     load = RAM, type = rw;
    BSS:      load = RAM, type = bss, define = yes;
}
