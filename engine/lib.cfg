# Lib in Bank 1 (docs/specs/P6-engine.md 2.4/2.6; der Stub schaltet $FF00 = $7F, RAM unter I/O):
# Code $B000-$DBFF (11 KB), Tabellen $DC00-$DFFF (LIBTAB: Zellentabelle von GEOMSET, Arbeitstabellen von VIEW; nicht in
# der Datei, INIT löscht sie nicht), Variablen $E000-$E7FF (LIBBSS, nicht in der Datei, INIT löscht sie).
# Überschreitet der Code 11 KB, bricht ld65 ab.
MEMORY {
    HDR:    start = $AFFE, size = 2,     file = %O;
    CODE:   start = $B000, size = $2C00, file = %O;
    LIBTAB: start = $DC00, size = $0400, file = "";
    LIBBSS: start = $E000, size = $0800, file = "";
}
SEGMENTS {
    LOADADDR: load = HDR,    type = ro;
    CODE:     load = CODE,   type = rw;
    LIBTAB:   load = LIBTAB, type = bss, define = yes;
    LIBBSS:   load = LIBBSS, type = bss, define = yes;
}
