# sim65-Harness für die Lib (docs/specs/P6-engine.md 9.2): flacher 64-KB-Speicher wie die Bank-1-Karte 2.4.
#   $0000-$01FF  Zeropage und Stack (Zeropage der Lib: $FA-$FD)
#   $0200-$1FFF  "gemeinsames RAM": Parameterblock $0C00, Puffer der Engine $1300-$1BFF (vom Programm frei)
#   $2000-$4FFF  Programm (Harness, C-Laufzeit, Lib-Code), C-Stack am Ende
#   $5000-$CFFF  Daten der Szene an ihren Bank-1-Adressen (DMP, S2, DTS Wand, DVG ...)
#   $D000-$DFFF  frei (I/O der echten Karte)
#   $E000-$E7FF  Lib-Variablen (Segment LIBBSS, wie lib.cfg); $E800-$FFFF Szenendaten (DVG, DTS, DBG)
SYMBOLS {
    __EXEHDR__:    type = import;
    __STACKSIZE__: type = weak, value = $0400;
}
MEMORY {
    ZP:     file = "", start = $0000, size = $0100;
    HEADER: file = %O, start = $0000, size = $000C;
    MAIN:   file = %O, define = yes, start = $2000, size = $3000 - __STACKSIZE__;
    LIBBSS: file = "", start = $E000, size = $0800;
}
SEGMENTS {
    ZEROPAGE: load = ZP,     type = zp;
    EXEHDR:   load = HEADER, type = ro;
    STARTUP:  load = MAIN,   type = ro;
    LOWCODE:  load = MAIN,   type = ro,  optional = yes;
    ONCE:     load = MAIN,   type = ro,  optional = yes;
    CODE:     load = MAIN,   type = ro;
    RODATA:   load = MAIN,   type = ro;
    DATA:     load = MAIN,   type = rw;
    BSS:      load = MAIN,   type = bss, define = yes;
    LIBBSS:   load = LIBBSS, type = bss, define = yes;
}
FEATURES {
    CONDES: type = constructor, label = __CONSTRUCTOR_TABLE__, count = __CONSTRUCTOR_COUNT__, segment = ONCE;
    CONDES: type = destructor,  label = __DESTRUCTOR_TABLE__,  count = __DESTRUCTOR_COUNT__,  segment = RODATA;
    CONDES: type = interruptor, label = __INTERRUPTOR_TABLE__, count = __INTERRUPTOR_COUNT__, segment = RODATA, import = __CALLIRQ__;
}
