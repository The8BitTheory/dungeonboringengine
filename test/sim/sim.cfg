# sim65 harness for the lib (docs/specs/P6-engine.md 9.2): flat 64 KB memory like the bank 1 memory map 2.4.
#   $0000-$01FF  zero page and stack (zero page of the lib: $FA-$FD)
#   $0200-$1FFF  "common RAM": parameter block $0C00, engine buffer $1300-$1BFF (free for the program)
#   $2000-$2BFF  harness and C runtime (MAIN), $2C00-$2DFF C stack
#   $2E00-$AFFF  scene data (DMP, S2 from $4000, DTS wall/floor ...; layout: run_sim.py, checked by viewsim.c)
#   $B000-$DBFF  lib code (segment LIBCODE, like the real memory map 2.4); $DC00-$DFFF lib tables (LIBTAB)
#   $E000-$E7FF  lib variables (segment LIBBSS, like lib.cfg); $E800-$FBFF scene data (DVG, DTS ceiling, DBG; from $FC00 Blitz! runtime)
# The file is contiguous ($2000-$DBFF, the gap is filled with 0), sim65 loads it at $2000.
SYMBOLS {
    __EXEHDR__:    type = import;
    __STACKSIZE__: type = weak, value = $0200;      # harness needs little stack; room for the lib code
}
MEMORY {
    ZP:     file = "", start = $0000, size = $0100;
    HEADER: file = %O, start = $0000, size = $000C;
    MAIN:   file = %O, define = yes, start = $2000, size = $0E00 - __STACKSIZE__, fill = yes;
    GAP:    file = %O, start = $2E00 - __STACKSIZE__, size = $B000 - $2E00 + __STACKSIZE__, fill = yes;
    LIBC:   file = %O, start = $B000, size = $2C00;
    LIBTAB: file = "", start = $DC00, size = $0400;
    LIBBSS: file = "", start = $E000, size = $0800;
}
SEGMENTS {
    ZEROPAGE: load = ZP,     type = zp;
    EXEHDR:   load = HEADER, type = ro;
    STARTUP:  load = MAIN,   type = ro;
    LOWCODE:  load = MAIN,   type = ro,  optional = yes;
    ONCE:     load = MAIN,   type = ro,  optional = yes;
    CODE:     load = MAIN,   type = ro;
    RODATA:   load = MAIN,   type = ro;
    DATA:     load = MAIN,   type = rw;
    BSS:      load = MAIN,   type = bss, define = yes;
    LIBCODE:  load = LIBC,   type = rw;
    LIBTAB:   load = LIBTAB, type = bss, define = yes;
    LIBBSS:   load = LIBBSS, type = bss, define = yes;
}
FEATURES {
    CONDES: type = constructor, label = __CONSTRUCTOR_TABLE__, count = __CONSTRUCTOR_COUNT__, segment = ONCE;
    CONDES: type = destructor,  label = __DESTRUCTOR_TABLE__,  count = __DESTRUCTOR_COUNT__,  segment = RODATA;
    CONDES: type = interruptor, label = __INTERRUPTOR_TABLE__, count = __INTERRUPTOR_COUNT__, segment = RODATA, import = __CALLIRQ__;
}
