# sim65-Harness für den Build-Schalter VMS_COPY (wie sim.cfg): der Code ist seit P6l (Fernsicht) größer als die 11 KB der
# Karte 2.4, darum hier Lib-Code $B000-$DCFF und Lib-Tabellen (LIBTAB) bei $FC00 (über den Szenendaten). Nur Test.
# sim65-Harness für die Lib (docs/specs/P6-engine.md 9.2): flacher 64-KB-Speicher wie die Bank-1-Karte 2.4.
#   $0000-$01FF  Zeropage und Stack (Zeropage der Lib: $FA-$FD)
#   $0200-$1FFF  "gemeinsames RAM": Parameterblock $0C00, Puffer der Engine $1300-$1BFF (vom Programm frei)
#   $2000-$2BFF  Harness und C-Laufzeit (MAIN), $2C00-$2DFF C-Stack
#   $2E00-$AFFF  Daten der Szene (DMP, S2 ab $4000, DTS Wand/Boden ...; Lage: run_sim.py, viewsim.c prüft)
#   $B000-$DBFF  Lib-Code (Segment LIBCODE, wie die echte Karte 2.4); $DC00-$DFFF Lib-Tabellen (LIBTAB)
#   $E000-$E7FF  Lib-Variablen (Segment LIBBSS, wie lib.cfg); $E800-$FBFF Szenendaten (DVG, DTS Decke, DBG; ab $FC00 Blitz!-Runtime)
# Die Datei ist zusammenhängend ($2000-$DBFF, die Lücke ist mit 0 gefüllt), sim65 lädt sie an $2000.
SYMBOLS {
    __EXEHDR__:    type = import;
    __STACKSIZE__: type = weak, value = $0200;      # Harness braucht wenig Stack; Platz für den Lib-Code
}
MEMORY {
    ZP:     file = "", start = $0000, size = $0100;
    HEADER: file = %O, start = $0000, size = $000C;
    MAIN:   file = %O, define = yes, start = $2000, size = $0E00 - __STACKSIZE__, fill = yes;
    GAP:    file = %O, start = $2E00 - __STACKSIZE__, size = $B000 - $2E00 + __STACKSIZE__, fill = yes;
    LIBC:   file = %O, start = $B000, size = $2D00;
    LIBTAB: file = "", start = $FC00, size = $03F0;
    LIBBSS: file = "", start = $E000, size = $0800;
}
SEGMENTS {
    ZEROPAGE: load = ZP,     type = zp;
    EXEHDR:   load = HEADER, type = ro;
    STARTUP:  load = MAIN,   type = ro;
    LOWCODE:  load = MAIN,   type = ro,  optional = yes;
    ONCE:     load = MAIN,   type = ro,  optional = yes;
    CODE:     load = MAIN,   type = ro;
    RODATA:   load = MAIN,   type = ro;
    DATA:     load = MAIN,   type = rw;
    BSS:      load = MAIN,   type = bss, define = yes;
    LIBCODE:  load = LIBC,   type = rw;
    LIBTAB:   load = LIBTAB, type = bss, define = yes;
    LIBBSS:   load = LIBBSS, type = bss, define = yes;
}
FEATURES {
    CONDES: type = constructor, label = __CONSTRUCTOR_TABLE__, count = __CONSTRUCTOR_COUNT__, segment = ONCE;
    CONDES: type = destructor,  label = __DESTRUCTOR_TABLE__,  count = __DESTRUCTOR_COUNT__,  segment = RODATA;
    CONDES: type = interruptor, label = __INTERRUPTOR_TABLE__, count = __INTERRUPTOR_COUNT__, segment = RODATA, import = __CALLIRQ__;
}
