format  = "dbetex"
version = 1

# Wall: 4 styles (style number in the map = index + 1): 1 brick, 2 grating, 3 window, 4 arch
[texset]
name       = "walls"
kind       = "wall"
geom       = "../build/demo/geom/west140.geom.json"
dvg        = "../build/demo/geom/west140.dvg"
out        = "../build/demo/tex"
load       = 0x8000
vrl_load   = 0x9000        # load buffer of the VRL files in bank 0 (RXV source from +5), above the program
pool_bytes = 36735

[[style]]
name = "brick"
png  = "art/brick_atlas.png"

[[style]]
name = "grating"
png  = "art/grating_atlas.png"

[[style]]
name     = "window"
aseprite = "art/window.json"
tag      = "window"

[[style]]
name     = "arch"
aseprite = "art/window.json"
tag      = "arch"
