format  = "dbetex"
version = 1

# Wand: 4 Stile (Stilnummer in der Karte = Index + 1): 1 ziegel, 2 gitter, 3 fenster, 4 bogen
[texset]
name       = "walls"
kind       = "wall"
geom       = "../build/demo/geom/west140.geom.json"
dvg        = "../build/demo/geom/west140.dvg"
out        = "../build/demo/tex"
load       = 0x8000
vrl_load   = 0x9000        # Ladepuffer der VRL-Dateien in Bank 0 (RXV-Quelle ab +5), über dem Programm
pool_bytes = 36735

[[style]]
name = "ziegel"
png  = "art/ziegel_atlas.png"

[[style]]
name = "gitter"
png  = "art/gitter_atlas.png"

[[style]]
name     = "fenster"
aseprite = "art/fenster.json"
tag      = "fenster"

[[style]]
name     = "bogen"
aseprite = "art/fenster.json"
tag      = "bogen"
