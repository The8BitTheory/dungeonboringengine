# Demo: Westwood-Geometrie 140 x 96 (Spalten 5-74, Zeile 0 des Chunky-Bildschirms 160 x 100), Zeilen 96-99 für den Kompass
[viewport]
preset   = "westwood"
width_px = 140
height   = 96
origin   = 5
stride   = 80
depth    = 3
# byte_edges bleibt aus: Kanten pixelgenau (Frage 4 in docs/specs/P7-crawl.md)

[output]
name       = "west140"
dir        = "../build/demo/geom"
load       = 0xE800
pool_bytes = 36735
zoom       = 4
