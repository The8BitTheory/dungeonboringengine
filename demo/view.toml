# Demo: Westwood geometry 140 x 96 (columns 5-74, row 0 of the chunky screen 160 x 100), rows 96-99 for the compass
[viewport]
preset   = "westwood"
width_px = 140
height   = 96
origin   = 5
stride   = 80
depth    = 3
# byte_edges stays off: pixel-exact edges (question 4 in docs/specs/P7-crawl.md)

[output]
name       = "west140"
dir        = "../build/demo/geom"
load       = 0xE800
pool_bytes = 36735
zoom       = 4
