format  = "dbemap"
version = 1

# Demo map 20 x 16 (Dungeon Boring Engine, docs/specs/P7-crawl.md 8.3).
# Wall styles: 1 brick, 2 grating, 3 window, 4 arch; floor style 1 stone; ceiling style 1 wood (order as in walls.toml).
#
#   Courtyard (sky, windows to the north and east)  x 11-18, y 1-5      Chamber with abyss  x 11-18, y 7-9
#   Door (archway, walkable) at (13, 6)       Grate with gem at (17, 6)
#   Room in the southwest (start; windows to the west and south)  x 1-6, y 10-14
[map]
name    = "demo"
start   = [2, 11]
dir     = "W"
outside = "outside"      # everything outside the map: no walls, no floor, no ceiling -> only wallpaper behind windows

[tiles.wall]
walls   = 1
flags   = ["solid", "blocksight", "occluding", "automap"]

[tiles.corridor]
floor   = 1
ceiling = 1

[tiles.courtyard]               # sky: ceiling style 0
floor   = 1

[tiles.abyss]           # abyss: floor style 0, not enterable
ceiling = 1
flags   = ["solid"]

[tiles.window]           # wall style window, not opaque: outside tile behind it (wallpaper only)
walls   = 3
flags   = ["solid", "automap"]

[tiles.grating]            # not opaque, CONTENT: an item behind it (in the cell)
walls   = 2
floor   = 1
ceiling = 1
flags   = ["solid", "content", "automap"]

[tiles.door]              # archway with CONTENT, without SOLID: walkable, goblins pass through
walls   = 4
floor   = 1
ceiling = 1
flags   = ["content", "door"]

[tiles.outside]
# no walls, no floor, no ceiling

[legend]
"#" = "wall"
"." = "corridor"
"," = "courtyard"
":" = "abyss"
"F" = "window"
"+" = "grating"
"D" = "door"
"m" = { tile = "corridor", item = 1 }
"h" = { tile = "courtyard", item = 1 }
"G" = { tile = "grating", item = 1 }

[layers]
tiles = """
############F#F#F###
#........#,,,,,,,,,#
#.######.##,,,,,,,,F
#.######m##,,,,,h,,#
#.######.##,,,,,,,,F
#......####,,,,,,,,#
###.##.######D###G##
###.##.####........#
###.##........::::.#
###.######....::::.#
#......###.#########
F......###.#########
#....m.....#########
F......#############
#......#############
##F#F###############
"""

[[events]]                # start points of the goblins (route per goblin in demo.bas)
at    = [13, 2]
type  = "enemy"
param = 1

[[events]]
at    = [15, 5]
type  = "enemy"
param = 2

[[events]]
at    = [12, 1]
type  = "enemy"
param = 3
