<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DBE Tools</title>
<link rel="stylesheet" href="app.css">
<script type="module" src="js/app.js"></script>
</head>
<body>
<header class="bar">
  <strong class="brand">DBE Tools</strong>
  <button id="open" class="btn">Open project folder</button>
  <button id="reopen" class="btn" hidden></button>
  <span id="project" class="muted"></span>
  <nav id="tabs" class="tabs" role="tablist">
    <button role="tab" data-tab="map" aria-selected="true">Map</button>
    <button role="tab" data-tab="geom" disabled title="phase 2">Geometry</button>
    <button role="tab" data-tab="tex" disabled title="phase 2">Textures</button>
    <button role="tab" data-tab="spr" disabled title="phase 2">Sprites</button>
    <button role="tab" data-tab="bake" disabled title="phase 3">Bake/Pack</button>
  </nav>
  <span id="status" class="status" role="status"></span>
</header>
<main class="layout">
  <aside class="files">
    <h2>Project files</h2>
    <p id="nofiles" class="muted">Open the folder that holds the project TOML files and the built assets
      (e.g. the dungeonboringengine repository).</p>
    <ul id="filelist"></ul>
  </aside>
  <section id="view-map" class="panel"></section>
</main>
</body>
</html>
